<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration</title>
    <link href="../css/styles.css" rel="stylesheet">
    <link href="../css/full.css" rel="stylesheet" type="text/css" />
    <script src="../js/tailwind.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/neuralMesh.js"></script>
    <script src="../js/serviceCache.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/status.js"></script>
    <style>
        .navbar-end .btn-circle svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .navbar-end .btn-circle:hover svg {
            color: #e2e8f0;
        }

        .navbar-end .menu {
            display: flex;
            align-items: center;
        }

        .navbar-end .btn-circle.btn-lg {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar-end .btn-circle.btn-lg svg {
            margin-top: 15px;
            width: 25px;
            height: 25px;
            color: white;
        }

        .navbar-end .btn-circle.btn-lg:hover svg {
            color: #e2e8f0;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        #radar-settings-card {
            display: none;
        }
    </style>
</head>

<body>
    <main class="bg-neural">
        <div class="widget-container" id="settings-container">
            <h1>Settings</h1>
            <div class="widget-card-grid">
                <a href="/config/recorder" class="widget-card" id="settings-card-recorder" data-testid="settings-card-recorder">
                    <h3>MCAP Recorder</h3>
                </a>
                <a href="/config/camera" class="widget-card" id="settings-card-camera" data-testid="settings-card-camera">
                    <h3>Camera Settings</h3>
                </a>
                <a href="/config/model" class="widget-card" id="settings-card-model" data-testid="settings-card-model">
                    <h3>Model Settings</h3>
                </a>
                <a href="/config/services" class="widget-card" id="settings-card-services" data-testid="settings-card-services">
                    <h3>Service Status</h3>
                </a>
                <a href="/config/lidarpub" class="widget-card" id="settings-card-lidar" data-testid="settings-card-lidar">
                    <h3>LiDAR Settings</h3>
                </a>
                <a href="#" class="widget-card" id="settings-card-studio" data-testid="settings-card-studio" onclick="showStudioSettings(); return false;">
                    <h3>EdgeFirst Studio</h3>
                </a>
            </div>
            <!-- Radar Settings card will be added dynamically if needed -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetch('/config/webui/details')
                .then(response => response.json())
                .then(data => {
                    const deviceType = data.DEVICE;
                    const cardGrid = document.querySelector('.widget-card-grid');

                    if (deviceType.toLowerCase() !== 'maivin') {
                        const radarSettingsCard = document.createElement('a');
                        radarSettingsCard.href = '/config/radarpub';
                        radarSettingsCard.className = 'widget-card';
                        radarSettingsCard.id = 'settings-card-radar';
                        radarSettingsCard.setAttribute('data-testid', 'settings-card-radar');
                        const radarHeading = document.createElement('h3');
                        radarHeading.textContent = 'Radar Settings';
                        radarSettingsCard.appendChild(radarHeading);
                        cardGrid.appendChild(radarSettingsCard);

                        const fusionSettingsCard = document.createElement('a');
                        fusionSettingsCard.href = '/config/fusion';
                        fusionSettingsCard.className = 'widget-card';
                        fusionSettingsCard.id = 'settings-card-fusion';
                        fusionSettingsCard.setAttribute('data-testid', 'settings-card-fusion');
                        const fusionHeading = document.createElement('h3');
                        fusionHeading.textContent = 'Fusion Settings';
                        fusionSettingsCard.appendChild(fusionHeading);
                        cardGrid.appendChild(fusionSettingsCard);
                    }
                })
                .catch(error => {
                    console.error('Error fetching device type:', error);
                });
        });

        window.addEventListener('DOMContentLoaded', () => {
            initNavbar('Settings');
            // Initialize neural mesh background (dark mode only)
            NeuralMesh.init();
        });

        // Show Studio settings modal - creates dialog with safe DOM methods
        function showStudioSettings() {
            let dialog = document.getElementById('studioSettingsDialog');
            if (!dialog) {
                dialog = document.createElement('dialog');
                dialog.id = 'studioSettingsDialog';
                dialog.className = 'modal';
                dialog.style.padding = '0';

                // Build dialog content using safe DOM methods
                const container = document.createElement('div');
                container.style.cssText = 'padding: 2rem; background: var(--color-card-bg); border-radius: 1rem; min-width: 380px; max-width: 90vw; box-shadow: 0 8px 32px var(--color-shadow);';

                // Header
                const header = document.createElement('div');
                header.style.cssText = 'display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem;';

                const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                icon.setAttribute('viewBox', '0 0 24 24');
                icon.setAttribute('fill', 'none');
                icon.setAttribute('stroke', 'currentColor');
                icon.setAttribute('stroke-width', '1.5');
                icon.style.cssText = 'width: 32px; height: 32px; color: var(--color-card-title);';
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('stroke-linecap', 'round');
                path.setAttribute('stroke-linejoin', 'round');
                path.setAttribute('d', 'M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z');
                icon.appendChild(path);
                header.appendChild(icon);

                const title = document.createElement('h2');
                title.style.cssText = 'font-size: 1.25rem; font-weight: 600; margin: 0; color: var(--color-card-title);';
                title.textContent = 'EdgeFirst Studio';
                header.appendChild(title);
                container.appendChild(header);

                // Content section
                const content = document.createElement('div');
                content.id = 'studioSettingsContent';
                content.style.marginBottom = '1.5rem';

                // Connection status row
                const statusRow = document.createElement('div');
                statusRow.style.cssText = 'display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;';
                const dot = document.createElement('span');
                dot.id = 'studioConnectionDot';
                dot.style.cssText = 'width: 10px; height: 10px; border-radius: 50%; background: #9ca3af;';
                statusRow.appendChild(dot);
                const statusText = document.createElement('span');
                statusText.id = 'studioConnectionStatus';
                statusText.style.color = 'var(--color-text-secondary)';
                statusText.textContent = 'Checking status...';
                statusRow.appendChild(statusText);
                content.appendChild(statusRow);

                // User info (hidden by default)
                const userInfo = document.createElement('div');
                userInfo.id = 'studioUserInfo';
                userInfo.style.cssText = 'display: none; margin-bottom: 1rem; padding: 0.75rem; background: var(--color-bg-elevated); border-radius: 0.5rem;';
                const userLabel = document.createElement('div');
                userLabel.style.cssText = 'font-weight: 500; color: var(--color-text-primary);';
                userLabel.textContent = 'Logged in as:';
                userInfo.appendChild(userLabel);
                const usernameEl = document.createElement('div');
                usernameEl.id = 'studioUsername';
                usernameEl.style.color = 'var(--color-text-secondary)';
                userInfo.appendChild(usernameEl);
                content.appendChild(userInfo);

                // Server info
                const serverInfo = document.createElement('div');
                serverInfo.id = 'studioServerInfo';
                serverInfo.style.cssText = 'margin-bottom: 1rem; padding: 0.75rem; background: var(--color-bg-elevated); border-radius: 0.5rem;';
                const serverLabel = document.createElement('div');
                serverLabel.style.cssText = 'font-weight: 500; color: var(--color-text-primary); margin-bottom: 0.25rem;';
                serverLabel.textContent = 'Server';
                serverInfo.appendChild(serverLabel);
                const serverUrl = document.createElement('div');
                serverUrl.id = 'studioServerUrl';
                serverUrl.style.cssText = 'color: var(--color-text-secondary); font-size: 0.875rem;';
                serverUrl.textContent = '-';
                serverInfo.appendChild(serverUrl);
                content.appendChild(serverInfo);
                container.appendChild(content);

                // Button row
                const btnRow = document.createElement('div');
                btnRow.style.cssText = 'display: flex; gap: 0.75rem; justify-content: flex-end;';

                const closeBtn = document.createElement('button');
                closeBtn.type = 'button';
                closeBtn.className = 'btn-secondary';
                closeBtn.style.cssText = 'padding: 0.5rem 1rem;';
                closeBtn.textContent = 'Close';
                closeBtn.addEventListener('click', () => dialog.close());
                btnRow.appendChild(closeBtn);

                const loginBtn = document.createElement('button');
                loginBtn.type = 'button';
                loginBtn.id = 'studioLoginBtn';
                loginBtn.className = 'btn-primary';
                loginBtn.style.cssText = 'padding: 0.5rem 1rem;';
                loginBtn.textContent = 'Login';
                loginBtn.addEventListener('click', handleStudioAuth);
                btnRow.appendChild(loginBtn);
                container.appendChild(btnRow);

                dialog.appendChild(container);
                document.body.appendChild(dialog);
            }

            // Update status before showing
            updateStudioSettingsStatus();
            dialog.showModal();
        }

        // Update status in the settings dialog
        async function updateStudioSettingsStatus() {
            const connectionDot = document.getElementById('studioConnectionDot');
            const connectionStatus = document.getElementById('studioConnectionStatus');
            const userInfo = document.getElementById('studioUserInfo');
            const username = document.getElementById('studioUsername');
            const serverUrl = document.getElementById('studioServerUrl');
            const loginBtn = document.getElementById('studioLoginBtn');

            if (!connectionDot) return;

            try {
                const response = await fetch('/api/auth/status');
                if (response.ok) {
                    const data = await response.json();
                    serverUrl.textContent = 'https://studio.edgefirst.ai';

                    if (data.authenticated) {
                        connectionDot.style.background = '#22c55e';
                        connectionStatus.textContent = 'Connected';
                        userInfo.style.display = 'block';
                        username.textContent = data.username || 'Unknown';
                        loginBtn.textContent = 'Logout';
                        loginBtn.className = 'btn-danger';
                        loginBtn.style.cssText = 'padding: 0.5rem 1rem;';
                    } else {
                        connectionDot.style.background = '#9ca3af';
                        connectionStatus.textContent = 'Not connected';
                        userInfo.style.display = 'none';
                        loginBtn.textContent = 'Login';
                        loginBtn.className = 'btn-primary';
                        loginBtn.style.cssText = 'padding: 0.5rem 1rem;';
                    }
                } else {
                    connectionDot.style.background = '#9ca3af';
                    connectionStatus.textContent = 'Not connected';
                    userInfo.style.display = 'none';
                    loginBtn.textContent = 'Login';
                    loginBtn.className = 'btn-primary';
                    loginBtn.style.cssText = 'padding: 0.5rem 1rem;';
                }
            } catch (e) {
                connectionDot.style.background = '#ef4444';
                connectionStatus.textContent = 'Error checking status';
                userInfo.style.display = 'none';
            }
        }

        // Handle login/logout
        async function handleStudioAuth() {
            const loginBtn = document.getElementById('studioLoginBtn');
            const isLogout = loginBtn.textContent === 'Logout';

            if (isLogout) {
                try {
                    await fetch('/api/auth/logout', { method: 'POST' });
                    updateStudioSettingsStatus();
                    if (typeof window.updateStudioStatus === 'function') {
                        window.updateStudioStatus();
                    }
                } catch (e) {
                    console.error('Logout error:', e);
                }
            } else {
                if (typeof showStudioLoginDialog === 'function') {
                    document.getElementById('studioSettingsDialog').close();
                    showStudioLoginDialog();
                }
            }
        }
    </script>
</body>

</html>
