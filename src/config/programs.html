<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programs</title>
    <link href="../css/styles.css" rel="stylesheet">
    <link href="../css/full.css" rel="stylesheet" type="text/css" />
    <script src="../js/tailwind.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/neuralMesh.js"></script>
    <script src="../js/serviceCache.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/status.js"></script>
    <style>
        main {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .action-bar h2 {
            color: var(--color-text-primary);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-new {
            background: var(--brand-gold);
            color: #1a1625;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-new:hover { opacity: 0.9; }

        .btn-import {
            background: var(--color-card-bg);
            color: var(--color-text-primary);
            border: 1px solid var(--color-border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-import:hover { background: var(--color-bg-elevated); }

        .program-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .program-card {
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid var(--color-border);
        }

        .program-card[data-status="running"] { border-left-color: #22c55e; }
        .program-card[data-status="stopped"] { border-left-color: var(--brand-gold); }
        .program-card[data-status="error"]   { border-left-color: #ef4444; }
        .program-card[data-status="deploying"] { border-left-color: #3b82f6; }

        .program-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .program-card-name {
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .program-card-status {
            font-size: 0.75rem;
        }

        .program-card-status.running  { color: #22c55e; }
        .program-card-status.stopped  { color: var(--brand-gold); }
        .program-card-status.error    { color: #ef4444; }
        .program-card-status.deploying { color: #3b82f6; }

        .program-card-desc {
            color: var(--color-text-secondary);
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .program-card-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .program-card-actions button {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .btn-edit {
            background: var(--brand-navy);
            color: white;
        }

        .btn-action {
            background: var(--color-bg-elevated);
            color: var(--color-text-primary);
            border: 1px solid var(--color-border) !important;
        }

        .btn-action:hover { opacity: 0.8; }

        .btn-delete {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444 !important;
        }

        .btn-delete:hover { background: #ef4444; color: white; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-secondary);
        }

        .empty-state h3 {
            color: var(--color-text-primary);
            margin-bottom: 8px;
        }

        /* Log panel */
        .log-panel {
            background: #1a1625;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        .log-panel.visible { display: block; }

        .log-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #231e30;
            color: #a0a0b0;
            font-size: 0.8rem;
        }

        .log-panel-close {
            background: none;
            border: none;
            color: #a0a0b0;
            cursor: pointer;
            font-size: 1rem;
        }

        .log-panel-body {
            padding: 8px 12px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .log-line { white-space: pre-wrap; word-break: break-all; }
        .log-line.debug { color: #5c6370; }
        .log-line.info  { color: #a8e6a0; }
        .log-line.warn  { color: #e8b820; }
        .log-line.error { color: #ef4444; }
    </style>
</head>

<body>
    <main class="bg-neural">
        <div class="action-bar">
            <h2>Programs</h2>
            <div class="action-buttons">
                <input type="file" id="import-file" accept=".efapp,.zip" style="display:none" aria-label="Import .efapp bundle">
                <button class="btn-import" data-testid="programs-btn-import" onclick="document.getElementById('import-file').click()">Import</button>
                <button class="btn-new" data-testid="programs-btn-new" onclick="location.href='program-editor.html'">+ New Program</button>
            </div>
        </div>

        <div id="program-grid" class="program-grid" role="list"></div>
        <div id="empty-state" class="empty-state" style="display:none">
            <h3>No programs yet</h3>
            <p>Create a new program or import an .efapp bundle to get started.</p>
        </div>

        <div id="log-panel" class="log-panel" data-testid="programs-log-panel" role="log" aria-live="polite">
            <div class="log-panel-header">
                <span id="log-panel-title">Logs</span>
                <button class="log-panel-close" id="log-panel-close" aria-label="Close logs">&times;</button>
            </div>
            <div id="log-panel-body" class="log-panel-body"></div>
        </div>
    </main>

    <script>
        window.addEventListener('load', () => {
            initNavbar('Programs');
            NeuralMesh.init();
        });
    </script>
    <script type="module" src="../js/programs.js"></script>
</body>

</html>
