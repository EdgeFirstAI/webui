<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion Configuration</title>
    <link href="../css/styles.css" rel="stylesheet">
    <link href="../css/full.css" rel="stylesheet" type="text/css" />

    <script src="../js/tailwind.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/neuralMesh.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/serviceCache.js"></script>
    <script src="../js/status.js"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--color-bg-base);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--color-card-bg);
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px var(--color-shadow);
            background-color: var(--color-card-bg);
            max-height: auto;
            margin-top: auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--color-text-primary);
            font-size: 24px;
        }

        label {
            font-weight: 500;
            color: var(--color-text-primary);
            display: block;
            margin-bottom: 8px;
        }

        .comment {
            font-style: italic;
            color: var(--color-text-muted);
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid var(--color-border);
            font-size: 16px;
            background-color: var(--color-bg-surface);
            color: var(--color-text-primary);
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--brand-gold);
            outline: none;
        }

        .form-group input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }

        .navbar-end .btn-circle svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .navbar-end .btn-circle:hover svg {
            color: #e2e8f0;
        }

        .navbar-end .menu {
            display: flex;
            align-items: center;
        }

        .navbar-end .btn-circle.btn-lg {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar-end .btn-circle.btn-lg svg {
            margin-top: -5px;
            width: 25px;
            height: 25px;
            color: white;
        }

        .navbar-end .btn-circle.btn-lg:hover svg {
            color: #e2e8f0;
        }



        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .loading-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--color-card-bg);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: var(--color-text-primary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 10px;
            border: 4px solid var(--color-border);
            border-top: 4px solid var(--brand-navy);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Save Button Container */
        .button-container {
            position: sticky;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px;
            background: linear-gradient(to top, var(--color-card-bg) 60%, transparent);
        }

        /* Save Button Style */
        button#saveConfig {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>
    <main class="bg-neural">
        <div class="container">
            <h2>Fusion Configuration</h2>

            <div class="form-group">
                <label for="rust_log">Log Level:</label>
                <input type="text" id="rust_log" name="rust_log" value="info">
            </div>

            <div class="form-group">
                <label for="radar_input_topic">Radar Input Topic:</label>
                <input type="text" id="radar_input_topic" name="radar_input_topic" value="radar/clusters">
            </div>

            <div class="form-group">
                <label for="model">The Radar model</label>
                <input type="text" id="model" name="model" value="/usr/share/fusion/radarexp-ultra-short.tflite">
            </div>

            <div class="form-group">
                <label for="threshold">Threshold:</label>
                <input type="number" id="threshold" name="threshold" min="1" value="3">
            </div>

            <div class="form-group">
                <label for="occ_angle_limit">Occlusion Angle Limit:</label>
                <input type="number" id="occ_angle_limit" name="occ_angle_limit" step="0.1" value="20.0">
            </div>

            <div class="form-group">
                <label for="occ_range_limit">Occlusion Range Limit:</label>
                <input type="number" id="occ_range_limit" name="occ_range_limit" step="0.1" value="1.0">
            </div>

            <div class="form-group">
                <label for="range_bin_limit">Range Bin Limit:</label>
                <input type="text" id="range_bin_limit" name="range_bin_limit" value="0.0 20.0">
            </div>

            <div class="form-group">
                <label for="range_bin_width">Range Bin Width:</label>
                <input type="number" id="range_bin_width" name="range_bin_width" step="0.1" value="0.5">
            </div>

            <div class="form-group">
                <label for="angle_bin_limit">Angle Bin Limit:</label>
                <input type="text" id="angle_bin_limit" name="angle_bin_limit" value="-70.0 70.0">
            </div>

            <div class="form-group">
                <label for="angle_bin_width">Angle Bin Width:</label>
                <input type="number" id="angle_bin_width" name="angle_bin_width" step="0.1" value="10.0">
            </div>

            <div class="form-group">
                <label for="bin_delay">Bin Delay:</label>
                <input type="number" id="bin_delay" name="bin_delay" min="1" value="3">
            </div>

            <div class="button-container">
                <button id="saveConfig" class="btn-primary btn-block">
                    Save Configuration
                </button>
            </div>
        </div>
    </main>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div>Saving configuration...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetch('/api/config/fusion', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                }).then(data => {
                    document.getElementById('rust_log').value = data.RUST_LOG || '';
                    document.getElementById('radar_input_topic').value = data.RADAR_INPUT_TOPIC || '';
                    document.getElementById('model').value = data.MODEL || '';
                    document.getElementById('threshold').value = data.THRESHOLD || '';
                    document.getElementById('occ_angle_limit').value = data.OCC_ANGLE_LIMIT || '';
                    document.getElementById('occ_range_limit').value = data.OCC_RANGE_LIMIT || '';

                    const rangeBinLimit = Array.isArray(data.RANGE_BIN_LIMIT) ? data.RANGE_BIN_LIMIT.join(' ') : (data.RANGE_BIN_LIMIT || '');
                    document.getElementById('range_bin_limit').value = rangeBinLimit.replace(/,/g, ' ');

                    document.getElementById('range_bin_width').value = data.RANGE_BIN_WIDTH || '';

                    const angleBinLimit = Array.isArray(data.ANGLE_BIN_LIMIT) ? data.ANGLE_BIN_LIMIT.join(' ') : (data.ANGLE_BIN_LIMIT || '');
                    document.getElementById('angle_bin_limit').value = angleBinLimit.replace(/,/g, ' ');

                    document.getElementById('angle_bin_width').value = data.ANGLE_BIN_WIDTH || '';
                    document.getElementById('bin_delay').value = data.BIN_DELAY || '';
                })
                .catch(error => console.error('Error fetching configuration:', error));
        });
        document.getElementById('saveConfig').addEventListener('click', function () {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.style.display = 'block';

            const configData = {
                fileName: "fusion",
                rust_log: document.getElementById('rust_log').value,
                radar_input_topic: document.getElementById('radar_input_topic').value,
                model: document.getElementById('model').value,
                threshold: document.getElementById('threshold').value,
                occ_angle_limit: document.getElementById('occ_angle_limit').value,
                occ_range_limit: document.getElementById('occ_range_limit').value,
                range_bin_limit: document.getElementById('range_bin_limit').value,
                range_bin_width: document.getElementById('range_bin_width').value,
                angle_bin_limit: document.getElementById('angle_bin_limit').value,
                angle_bin_width: document.getElementById('angle_bin_width').value,
                bin_delay: document.getElementById('bin_delay').value
            };

            fetch('/api/config/fusion', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(configData)
            })
                .then(response => {
                    loadingOverlay.style.display = 'none';
                    if (response.ok) {
                    } else {
                        alert('Error saving configuration');
                    }
                })
                .catch(error => {
                    loadingOverlay.style.display = 'none';
                    console.error('Error:', error);
                    alert('Error saving configuration');
                });
        });

        window.addEventListener('DOMContentLoaded', () => {
            initNavbar('Fusion');
            NeuralMesh.init();
        });
    </script>
</body>

</html>
