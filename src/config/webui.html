<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebUI Configuration</title>
    <!-- Include external stylesheets -->
    <link href="../css/full.css" rel="stylesheet" type="text/css" />

    <link href="../css/styles.css" rel="stylesheet">
    <!-- Include Tailwind CSS script -->
    <script src="../js/tailwind.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/neuralMesh.js"></script>
    <script src="../js/serviceCache.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/status.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--color-bg-base);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-color: var(--color-bg-base);
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px var(--color-shadow);
            background-color: var(--color-card-bg);
            max-height: auto;
            margin-top: auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--color-text-primary);
            font-size: 24px;
        }

        label {
            font-weight: 500;
            color: var(--color-text-primary);
            display: block;
            margin-bottom: 8px;
        }

        .comment {
            font-style: italic;
            color: var(--color-text-muted);
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid var(--color-border);
            font-size: 16px;
            background-color: var(--color-bg-surface);
            color: var(--color-text-primary);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--brand-gold);
        }

        .form-group input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }

        .navbar-end .btn-circle svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .navbar-end .btn-circle:hover svg {
            color: #e2e8f0;
        }

        .navbar-end .menu {
            display: flex;
            align-items: center;
        }

        .navbar-end .btn-circle.btn-lg {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar-end .btn-circle.btn-lg svg {
            margin-top: -5px;
            width: 25px;
            height: 25px;
            color: white;
        }

        .navbar-end .btn-circle.btn-lg:hover svg {
            color: #e2e8f0;
        }

        .toggle-switch-container {
            display: inline-block;
            vertical-align: middle;
            margin: 0 10px;
        }

        .toggle-switch-label {
            display: block;
            width: 60px;
            height: 34px;
            background-color: #ccc;
            border-radius: 34px;
            cursor: pointer;
            position: relative;
            transition: background-color 0.3s;
        }

        .toggle-switch-label .toggle-switch-inner {
            display: block;
            width: 200%;
            margin-left: -100%;
            transition: margin 0.3s;
        }

        .toggle-switch-label .toggle-switch-switch {
            display: block;
            width: 26px;
            height: 26px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: 4px;
            left: 4px;
            transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .toggle-switch:checked+.toggle-switch-label {
            background-color: var(--brand-navy);
        }

        .toggle-switch:checked+.toggle-switch-label .toggle-switch-switch {
            transform: translateX(26px);
        }

        .device-type-text {
            font-weight: bold;
            margin-right: 10px;
            color: var(--color-text-primary);
        }

        .device-type-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px 0;
            background-color: var(--color-bg-elevated);
            border-bottom: 1px solid var(--color-border);
        }

        .device-type-wrapper {
            display: flex;
            align-items: center;
        }

        .device-type-value {
            font-weight: bold;
            min-width: 60px;
            text-align: left;
            color: var(--color-text-primary);
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .loading-spinner {
            background: var(--color-card-bg);
            color: var(--color-text-primary);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .spinner {
            border: 4px solid var(--color-border);
            border-top: 4px solid var(--brand-navy);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Save Button Container */
        .button-container {
            position: sticky;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px;
            background: linear-gradient(to top, var(--color-card-bg) 60%, transparent);
        }

        /* Save Button Style - using btn-primary from theme */
        button#saveConfig {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Loading Overlay */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .loading-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--color-card-bg);
            color: var(--color-text-primary);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

<body>
    <input type="hidden" id="device_type" value="MAIVIN">

    <main class="bg-neural">
        <div class="container">
            <h2>WebUI Configuration</h2>
            <div class="comment">
                Configure the settings for the WebUI Service, including bin widths, thresholds, and topics.
            </div>

            <!-- Angle Bin Configuration -->
            <div class="form-group">
                <label for="angle_bin_width">Angle Bin Width:</label>
                <input type="number" id="angle_bin_width" name="angle_bin_width" placeholder="10">
            </div>
            <div class="form-group">
                <label for="angle_bin_limits_min">Angle Bin Limits Min:</label>
                <input type="number" id="angle_bin_limits_min" name="angle_bin_limits_min" placeholder="-70">
            </div>
            <div class="form-group">
                <label for="angle_bin_limits_max">Angle Bin Limits Max:</label>
                <input type="number" id="angle_bin_limits_max" name="angle_bin_limits_max" placeholder="70">
            </div>

            <!-- Range Bin Configuration -->
            <div class="form-group">
                <label for="range_bin_width">Range Bin Width:</label>
                <input type="number" id="range_bin_width" name="range_bin_width" placeholder="0.5" step="0.1">
            </div>
            <div class="form-group">
                <label for="range_bin_limits_min">Range Bin Limits Min:</label>
                <input type="number" id="range_bin_limits_min" name="range_bin_limits_min" placeholder="0">
            </div>
            <div class="form-group">
                <label for="range_bin_limits_max">Range Bin Limits Max:</label>
                <input type="number" id="range_bin_limits_max" name="range_bin_limits_max" placeholder="20">
            </div>

            <!-- Window Length and Bin Threshold -->
            <div class="form-group">
                <label for="window_length">Window Length:</label>
                <input type="number" id="window_length" name="window_length" placeholder="18">
            </div>
            <div class="form-group">
                <label for="bin_threshold">Bin Threshold:</label>
                <input type="number" id="bin_threshold" name="bin_threshold" placeholder="3">
            </div>

            <!-- Use Box Checkbox -->
            <div class="form-group">
                <label for="use_box">Use Box:</label>
                <input type="checkbox" id="use_box" name="use_box">
            </div>

            <!-- Grid Draw PCD Options -->
            <div class="form-group">
                <label for="grid_draw_pcd">Grid Draw PCD:</label>
                <select id="grid_draw_pcd" name="grid_draw_pcd">
                    <option value="disabled">Disabled</option>
                    <option value="power">Power</option>
                    <option value="rcs">RCS</option>
                    <option value="speed">Speed</option>
                    <option value="fusion_class">Fusion Class</option>
                    <option value="vision_class">Vision Class</option>
                    <option value="combined_class">Combined Class</option>
                </select>
            </div>
            <div class="form-group">
                <label for="combined_grid_draw_pcd">Combined Grid Draw PCD:</label>
                <select id="combined_grid_draw_pcd" name="combined_grid_draw_pcd">
                    <option value="disabled">Disabled</option>
                    <option value="power">Power</option>
                    <option value="rcs">RCS</option>
                    <option value="speed">Speed</option>
                    <option value="fusion_class">Fusion Class</option>
                    <option value="vision_class">Vision Class</option>
                    <option value="combined_class">Combined Class</option>
                </select>
            </div>
            <div class="form-group">
                <label for="combined_camera_draw_pcd">Combined Camera Draw PCD:</label>
                <select id="combined_camera_draw_pcd" name="combined_camera_draw_pcd">
                    <option value="disabled">Disabled</option>
                    <option value="power">Power</option>
                    <option value="rcs">RCS</option>
                    <option value="speed">Speed</option>
                    <option value="fusion_class">Fusion Class</option>
                    <option value="vision_class">Vision Class</option>
                    <option value="combined_class">Combined Class</option>
                </select>
            </div>

            <!-- Combined Camera PCD Label -->
            <div class="form-group">
                <label for="combined_camera_pcd_label">Combined Camera PCD Label:</label>
                <input type="checkbox" id="combined_camera_pcd_label" name="combined_camera_pcd_label">
            </div>

            <div class="form-group">
                <label for="grid_flatten_pcd">Grid Flatten PCD:</label>
                <input type="checkbox" id="grid_flatten_pcd" name="grid_flatten_pcd">
            </div>
            <div class="form-group">
                <label for="combined_grid_flatten_pcd">Combined Grid Flatten PCD:</label>
                <input type="checkbox" id="combined_grid_flatten_pcd" name="combined_grid_flatten_pcd">
            </div>

            <!-- Draw Cells Checkbox -->
            <div class="form-group">
                <label for="draw_cells">Draw Cells:</label>
                <select id="draw_cells" name="draw_cells">
                    <option value="disabled">Disabled</option>
                    <option value="fusion_class">Fusion Class</option>
                    <option value="vision_class">Vision Class</option>
                    <option value="combined_class">Combined Class</option>
                </select>
            </div>

            <!-- Draw Unknown Cells Checkbox (When draw cells is enabled) -->
            <div class="form-group">
                <label for="draw_unknown_cells">Draw Unknown Cells:</label>
                <input type="checkbox" id="draw_unknown_cells" name="draw_unknown_cells">
            </div>

            <!-- Topic Configuration -->
            <div class="form-group">
                <label for="mask_topic">Mask Topic:</label>
                <input type="text" id="mask_topic" name="mask_topic" placeholder="/rt/detect/mask/">
            </div>
            <div class="form-group">
                <label for="detect_topic">Detect Topic:</label>
                <input type="text" id="detect_topic" name="detect_topic" placeholder="/rt/detect/boxes2d/">
            </div>
            <div class="form-group">
                <label for="pcd_topic">PCD Topic:</label>
                <input type="text" id="pcd_topic" name="pcd_topic" placeholder="/rt/radar/targets/">
            </div>
            <div class="form-group">
                <label for="h264_topic">H264 Topic:</label>
                <input type="text" id="h264_topic" name="h264_topic" placeholder="/rt/camera/h264/">
            </div>

            <!-- Draw Box Checkbox -->
            <div class="form-group">
                <label for="draw_box">Draw Box:</label>
                <input type="checkbox" id="draw_box" name="draw_box">
            </div>

            <!-- Draw Box Text Checkbox -->
            <div class="form-group">
                <label for="draw_box_text">Draw Box Text:</label>
                <input type="checkbox" id="draw_box_text" name="draw_box_text">
            </div>
            <!-- Show Stats Checkbox -->
            <div class="form-group">
                <label for="show_stats">Show Stats</label>
                <input type="checkbox" id="show_stats" name="show_stats">
            </div>
            <!-- Show People Count Checkbox -->
            <div class="form-group">
                <label for="show_people_count">Show People Count</label>
                <input type="checkbox" id="show_people_count" name="show_people_count">
            </div>
            <div class="button-container">
                <button id="saveConfig" class="btn-primary btn-block">
                    Save Configuration
                </button>
            </div>
        </div>
    </main>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div>Saving configuration...</div>
        </div>
    </div>

    <script>
        document.querySelector('#draw_cells').addEventListener('change', function () {
            const drawUnknownCells = document.querySelector('#draw_unknown_cells');
            drawUnknownCells.disabled = (this.value == "disabled");
            drawUnknownCells.checked = false
        });

        document.addEventListener('DOMContentLoaded', function () {
            fetch('/config/webui/details', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('angle_bin_width').value = data.ANGLE_BIN_WIDTH || 10;
                    document.getElementById('angle_bin_limits_min').value = data.ANGLE_BIN_LIMITS_MIN || -70;
                    document.getElementById('angle_bin_limits_max').value = data.ANGLE_BIN_LIMITS_MAX || 70;
                    document.getElementById('range_bin_width').value = data.RANGE_BIN_WIDTH || 0.5;
                    document.getElementById('range_bin_limits_min').value = data.RANGE_BIN_LIMITS_MIN || 0;
                    document.getElementById('range_bin_limits_max').value = data.RANGE_BIN_LIMITS_MAX || 20;
                    document.getElementById('window_length').value = data.WINDOW_LENGTH || 18;
                    document.getElementById('bin_threshold').value = data.BIN_THRESHOLD || 3;
                    document.getElementById('use_box').checked = data.USE_BOX === 'true' || data.USE_BOX === true;
                    document.getElementById('grid_draw_pcd').value = data.GRID_DRAW_PCD.replace(/"/g, '') || 'rcs';
                    document.getElementById('combined_grid_draw_pcd').value = data.COMBINED_GRID_DRAW_PCD.replace(/"/g, '') || 'disabled';
                    document.getElementById('combined_camera_draw_pcd').value = data.COMBINED_CAMERA_DRAW_PCD.replace(/"/g, '') || 'disabled';
                    document.getElementById('combined_camera_pcd_label').checked = data.COMBINED_CAMERA_PCD_LABEL === 'true' || data.COMBINED_CAMERA_PCD_LABEL === true;
                    document.getElementById('grid_flatten_pcd').checked = data.GRID_FLATTEN_PCD === 'true' || data.GRID_FLATTEN_PCD === true;
                    document.getElementById('combined_grid_flatten_pcd').checked = data.COMBINED_GRID_FLATTEN_PCD === 'true' || data.COMBINED_GRID_FLATTEN_PCD === true;
                    document.getElementById('mask_topic').value = data.MASK_TOPIC || '/rt/detect/mask/';
                    document.getElementById('detect_topic').value = data.DETECT_TOPIC || '/rt/detect/boxes2d/';
                    document.getElementById('pcd_topic').value = data.PCD_TOPIC || '/rt/radar/targets/';
                    document.getElementById('h264_topic').value = data.H264_TOPIC || '/rt/camera/h264/';
                    document.getElementById('draw_cells').value = data.DRAW_CELLS;
                    document.getElementById('draw_unknown_cells').checked = data.DRAW_UNKNOWN_CELLS === 'true' || data.DRAW_UNKNOWN_CELLS === true;
                    document.getElementById('draw_unknown_cells').disabled = (data.DRAW_CELLS == "disabled");
                    document.getElementById('draw_box').checked = data.DRAW_BOX === 'true' || data.DRAW_BOX === true;
                    document.getElementById('draw_box_text').checked = data.DRAW_BOX_TEXT === 'true' || data.DRAW_BOX_TEXT === true;
                    document.getElementById('show_stats').checked = data.SHOW_STATS === 'true' || data.SHOW_STATS === true;
                    document.getElementById('show_people_count').checked = data.SHOW_PEOPLE_COUNT === 'true' || data.SHOW_PEOPLE_COUNT === true;
                    const deviceToggle = document.getElementById('device_type');
                    const deviceTypeText = document.getElementById('device_type_text');
                    deviceToggle.checked = data.DEVICE === 'RAIVIN';
                    deviceTypeText.textContent = data.DEVICE || 'MAIVIN';

                    deviceToggle.addEventListener('change', function () {
                        deviceTypeText.textContent = this.checked ? 'RAIVIN' : 'MAIVIN';
                    });


                })
                .catch(error => console.error('Error fetching config:', error));
        });

        document.getElementById('saveConfig').addEventListener('click', function () {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.style.display = 'block';  // Show loading overlay

            const configData = {
                fileName: "webui",
                ANGLE_BIN_WIDTH: document.getElementById('angle_bin_width').value,
                ANGLE_BIN_LIMITS_MIN: document.getElementById('angle_bin_limits_min').value,
                ANGLE_BIN_LIMITS_MAX: document.getElementById('angle_bin_limits_max').value,
                RANGE_BIN_WIDTH: document.getElementById('range_bin_width').value,
                RANGE_BIN_LIMITS_MIN: document.getElementById('range_bin_limits_min').value,
                RANGE_BIN_LIMITS_MAX: document.getElementById('range_bin_limits_max').value,
                WINDOW_LENGTH: document.getElementById('window_length').value,
                BIN_THRESHOLD: document.getElementById('bin_threshold').value,
                USE_BOX: document.getElementById('use_box').checked.toString(),
                GRID_DRAW_PCD: document.getElementById('grid_draw_pcd').value,
                COMBINED_GRID_DRAW_PCD: document.getElementById('combined_grid_draw_pcd').value,
                COMBINED_CAMERA_DRAW_PCD: document.getElementById('combined_camera_draw_pcd').value,
                COMBINED_CAMERA_PCD_LABEL: document.getElementById('combined_camera_pcd_label').checked.toString(),
                GRID_FLATTEN_PCD: document.getElementById('grid_flatten_pcd').checked.toString(),
                COMBINED_GRID_FLATTEN_PCD: document.getElementById('combined_grid_flatten_pcd').checked.toString(),
                MASK_TOPIC: document.getElementById('mask_topic').value,
                DETECT_TOPIC: document.getElementById('detect_topic').value,
                PCD_TOPIC: document.getElementById('pcd_topic').value,
                H264_TOPIC: document.getElementById('h264_topic').value,
                DEVICE: document.getElementById('device_type').checked ? 'RAIVIN' : 'MAIVIN',
                DRAW_CELLS: document.getElementById('draw_cells').value.toString(),
                DRAW_UNKNOWN_CELLS: document.getElementById('draw_unknown_cells').checked.toString(),
                DRAW_BOX: document.getElementById('draw_box').checked.toString(),
                DRAW_BOX_TEXT: document.getElementById('draw_box_text').checked.toString(),
                SHOW_STATS: document.getElementById('show_stats').checked.toString(),
                SHOW_PEOPLE_COUNT: document.getElementById('show_people_count').checked.toString(),
            };

            fetch('/config/webui', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(configData)
            })
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(text => {
                            throw new Error(`HTTP error! status: ${response.status}, message: ${text}`);
                        });
                    }
                    return response.text();
                })
                .then(data => {
                    loadingOverlay.style.display = 'none';
                    window.location.reload();
                })
                .catch(error => {
                    loadingOverlay.style.display = 'none';
                    console.error('Error saving config:', error);
                    alert('Error saving configuration: ' + error.message);
                })
                .finally(() => {
                    loadingOverlay.style.display = 'none';
                });
        });

        window.addEventListener('DOMContentLoaded', () => {
            initNavbar('WebUI');
            NeuralMesh.init();
        });
    </script>
</body>

</html>
