<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Configuration</title>
    <link href="../css/styles.css" rel="stylesheet">
    <link href="../css/full.css" rel="stylesheet" type="text/css" />
    <script src="../js/tailwind.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/neuralMesh.js"></script>
    <script src="../js/serviceCache.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/status.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--color-bg-base);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-y: auto;
        }

        main {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            background-color: var(--color-bg-base);
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px var(--color-shadow);
            background-color: var(--color-card-bg);
            margin: 0 auto;
            margin-bottom: 100px;
            /* Add space for the save button */
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--color-text-primary);
            font-size: 24px;
        }

        label {
            font-weight: 500;
            color: var(--color-text-primary);
            display: block;
            margin-bottom: 8px;
        }

        .comment {
            font-style: italic;
            color: var(--color-text-muted);
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid var(--color-border);
            font-size: 16px;
            background-color: var(--color-bg-surface);
            color: var(--color-text-primary);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--brand-gold);
        }

        .form-group input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }

        .navbar-end .btn-circle svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .navbar-end .btn-circle:hover svg {
            color: #e2e8f0;
        }

        .navbar-end .menu {
            display: flex;
            align-items: center;
        }

        .navbar-end .btn-circle.btn-lg {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar-end .btn-circle.btn-lg svg {
            margin-top: -5px;
            width: 25px;
            height: 25px;
            color: white;
        }

        .navbar-end .btn-circle.btn-lg:hover svg {
            color: #e2e8f0;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .loading-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--color-card-bg);
            color: var(--color-text-primary);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 10px;
            border: 4px solid var(--color-border);
            border-top: 4px solid var(--brand-navy);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Save Button Container */
        .button-container {
            position: sticky;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px;
            background: linear-gradient(to top, var(--color-card-bg) 60%, transparent);
            z-index: 10;
        }

        /* Save Button Style - using btn-primary from theme */
        button#saveConfig {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>
    <main class="bg-neural">
    <div class="container">
        <h2>Model Configuration</h2>

        <div class="comment">
            Configure the settings for the Model service.
        </div>
        <div class="card"></div>
        <div class="form-group">
            <label for="model">MODEL:</label>
            <input type="text" id="model" value="/usr/share/model/peoplesegdet.rtm">
        </div>
        <!-- Commenting out decoder_model field
        <div class="form-group">
            <label for="decoder_model">DECODER_MODEL:</label>
            <input type="text" id="decoder_model" value="">
        </div>
        -->
        <div class="form-group">
            <label for="visualization">VISUALIZATION:</label>
            <select id="visualization">
                <option value="false">False</option>
                <option value="true">True</option>
            </select>
        </div>
        <div class="form-group">
            <label for="labels">LABELS:</label>
            <select id="labels">
                <option value="label">Label</option>
            </select>
        </div>
        <div class="form-group">
            <label for="threshold">THRESHOLD:</label>
            <input type="number" id="threshold" value="0.2" step="0.01">
        </div>
        <div class="form-group">
            <label for="iou">IOU:</label>
            <input type="number" id="iou" value="0.2" step="0.01">
        </div>
        <div class="form-group">
            <label for="max_boxes">MAX_BOXES:</label>
            <input type="number" id="max_boxes" value="50">
        </div>
        <div class="form-group">
            <label for="label_offset">LABEL_OFFSET:</label>
            <input type="number" id="label_offset" value="0">
        </div>
        <div class="form-group">
            <label for="engine">ENGINE:</label>
            <select id="engine">
                <option value="NPU">NPU</option>
                <option value="CPU">CPU</option>
                <option value="GPU">GPU</option>
            </select>
        </div>
        <div class="form-group">
            <label for="track">TRACK:</label>
            <select id="track">
                <option value="true">True</option>
                <option value="false">False</option>
            </select>
        </div>
        <div class="form-group">
            <label for="trackExtraLifespan">Track Extra Lifespan (seconds):</label>
            <input type="text" id="trackExtraLifespan" name="trackExtraLifespan" placeholder="2.0">
        </div>
        <div class="form-group">
            <label for="track_high_conf">TRACK_HIGH_CONF:</label>
            <input type="number" id="track_high_conf" value="0.4" step="0.01">
        </div>
        <div class="form-group">
            <label for="track_iou">TRACK_IOU:</label>
            <input type="number" id="track_iou" value="0.25" step="0.01">
        </div>
        <div class="form-group">
            <label for="track_update">TRACK_UPDATE:</label>
            <input type="number" id="track_update" value="0.25" step="0.01">
        </div>
        <div class="form-group">
            <label for="mask_compression">MASK_COMPRESSION:</label>
            <select id="mask_compression">
                <option value="true">True</option>
                <option value="false">False</option>
            </select>
        </div>
        <div class="form-group">
            <label for="viv_vx_enable_cache">VIV_VX_ENABLE_CACHE_GRAPH_BINARY:</label>
            <input type="number" id="viv_vx_enable_cache" value="0">
        </div>
        <div class="form-group">
            <label for="viv_vx_cache_dir">VIV_VX_CACHE_BINARY_GRAPH_DIR:</label>
            <input type="text" id="viv_vx_cache_dir" value="/var/cache">
        </div>
        <div class="button-container">
            <button id="saveConfig" class="btn-primary btn-block">
                Save Configuration
            </button>
        </div>
    </div>
    </main>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div>Saving configuration...</div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetch('/api/config/model', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    let modelValue = data.MODEL;
                    if (Array.isArray(data.MODEL)) {
                        modelValue = data.MODEL.join(' ');
                    } else if (typeof data.MODEL === 'string') {
                        modelValue = data.MODEL.replace(/,/g, ' ');
                    } else {
                        console.log('MODEL has unexpected type:', typeof data.MODEL, data.MODEL);
                    }
                    setInputValue('model', modelValue);
                    setInputValue('decoder_model', data.DECODER_MODEL);
                    setInputValue('visualization', data.VISUALIZATION, 'false');
                    setInputValue('labels', data.LABELS, 'label');
                    setInputValue('threshold', data.THRESHOLD, 0.2);
                    setInputValue('iou', data.IOU, 0.2);
                    setInputValue('max_boxes', data.MAX_BOXES, 50);
                    setInputValue('label_offset', data.LABEL_OFFSET, 0);
                    setInputValue('engine', data.ENGINE, 'NPU');
                    setInputValue('track', data.TRACK, 'true');
                    setInputValue('trackExtraLifespan', data.TRACK_EXTRA_LIFESPAN, 0.5);
                    setInputValue('track_high_conf', data.TRACK_HIGH_CONF, 0.4);
                    setInputValue('track_iou', data.TRACK_IOU, 0.25);
                    setInputValue('track_update', data.TRACK_UPDATE, 0.25);
                    setInputValue('mask_compression', data.MASK_COMPRESSION, 'true');
                    setInputValue('viv_vx_enable_cache', data.VIV_VX_ENABLE_CACHE_GRAPH_BINARY, 0);
                    setInputValue('viv_vx_cache_dir', data.VIV_VX_CACHE_BINARY_GRAPH_DIR, '/var/cache');
                })
                .catch(error => console.error('Error fetching configuration:', error));
        });
        document.getElementById('saveConfig').onclick = function () {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.style.display = 'block';
            const modelValue = document.getElementById('model')?.value;

            const configData = {
                fileName: "model",
                MODEL: modelValue,
                VISUALIZATION: document.getElementById('visualization')?.value,
                LABELS: document.getElementById('labels')?.value,
                THRESHOLD: document.getElementById('threshold')?.value,
                IOU: document.getElementById('iou')?.value,
                MAX_BOXES: document.getElementById('max_boxes')?.value,
                LABEL_OFFSET: document.getElementById('label_offset')?.value,
                ENGINE: document.getElementById('engine')?.value,
                TRACK: document.getElementById('track')?.value,
                TRACK_EXTRA_LIFESPAN: document.getElementById('trackExtraLifespan')?.value,
                TRACK_HIGH_CONF: document.getElementById('track_high_conf')?.value,
                TRACK_IOU: document.getElementById('track_iou')?.value,
                TRACK_UPDATE: document.getElementById('track_update')?.value,
                MASK_COMPRESSION: document.getElementById('mask_compression')?.value,
                VIV_VX_ENABLE_CACHE_GRAPH_BINARY: document.getElementById('viv_vx_enable_cache')?.value,
                VIV_VX_CACHE_BINARY_GRAPH_DIR: document.getElementById('viv_vx_cache_dir')?.value
            };
            Object.keys(configData).forEach(key => {
                if (configData[key] === undefined) {
                    delete configData[key];
                }
            });

            fetch('/api/config/model', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(configData)
            })
                .then(response => {
                    loadingOverlay.style.display = 'none';
                    if (!response.ok) {
                        throw new Error('Failed to save configuration');
                    }
                })
                .catch(error => {
                    loadingOverlay.style.display = 'none';
                    console.error('Error saving config:', error);
                    alert('Error saving configuration');
                });
        };

        function setInputValue(elementId, value, defaultValue) {
            const element = document.getElementById(elementId);
            if (element) {
                element.value = value ?? defaultValue;
            } else {
                console.warn(`Element with id '${elementId}' not found`);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initNavbar('Model');
            NeuralMesh.init();
        });
    </script>
</body>

</html>
