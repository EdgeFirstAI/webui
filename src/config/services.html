<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services Overview</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
    <link href="../css/full.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg-base);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--color-text-primary);
            overflow-y: auto;
        }


        header .logo img {
            width: 50px;
        }

        header .nav-menu a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            padding: 10px;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        header .nav-menu a:hover {
            background-color: var(--brand-indigo-deep);
        }

        main {
            flex: 1;
            padding: 40px 20px;
            background-color: var(--color-bg-base);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            background-color: var(--color-card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px var(--color-shadow);
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--color-text-primary);
        }

        .service-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .service-item {
            width: 240px;
            padding: 20px;
            background: var(--color-card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--color-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px;
            border: 1px solid var(--color-border);
        }

        .service-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px var(--color-shadow-hover);
            background-color: var(--color-bg-elevated);
            border-color: var(--color-border-hover);
        }

        h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--color-card-title);
        }

        .status {
            font-size: 1rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: inline-block;
        }

        .status.running {
            background-color: var(--color-status-success);
            color: #fff;
        }

        .status.not-running {
            background-color: var(--color-status-error);
            color: #fff;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
            align-items: center;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--color-text-muted);
            border-radius: 34px;
            transition: background-color 0.2s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 2px;
            bottom: 2px;
            background-color: var(--color-bg-surface);
            border-radius: 50%;
            transition: transform 0.2s;
        }

        input:checked+.slider {
            background-color: var(--brand-navy);
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        .toggle-label span {
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .enabled-status {
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        .enabled-status.enabled {
            color: var(--color-status-success);
        }

        .enabled-status.disabled {
            color: var(--color-status-error);
        }

        .icon {
            width: 20px;
            height: 20px;
        }

        .action-button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            color: white;
            transition: background-color 0.3s;
            width: 100%;
        }

        .action-button.start-button {
            background-color: var(--brand-navy);
        }

        .action-button.start-button:hover {
            background-color: var(--brand-indigo-deep);
        }

        .action-button.stop-button {
            background-color: var(--color-status-error);
        }

        .action-button.stop-button:hover {
            background-color: #b91c1c;
        }

        .no-services {
            text-align: center;
            color: var(--color-text-muted);
            font-size: 1rem;
            margin-top: 20px;
            font-weight: bold;
        }


        @media(max-width: 600px) {
            .container {
                padding: 10px;
            }

            .service-item {
                padding: 15px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

        .navbar-end .btn-circle svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .navbar-end .btn-circle:hover svg {
            color: #e2e8f0;
        }

        .navbar-end .menu {
            display: flex;
            align-items: center;
        }

        .navbar-end .btn-circle.btn-lg {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar-end .btn-circle.btn-lg svg {
            margin-top: -5px;
            width: 25px;
            height: 25px;
            color: white;
        }

        .navbar-end .btn-circle.btn-lg:hover svg {
            color: #e2e8f0;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .loading-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--color-card-bg);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: var(--color-text-primary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 10px;
            border: 4px solid var(--color-spinner-track);
            border-top: 4px solid var(--color-spinner-active);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <main class="bg-neural">
        <div class="container">
            <h1>Service Overview</h1>
            <ul id="service-list" class="service-list"></ul>
            <div id="error-message" class="no-services"></div>
        </div>
    </main>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div>Updating service...</div>
        </div>
    </div>

    <script src="../js/tailwind.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/neuralMesh.js"></script>
    <script src="../js/serviceCache.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/status.js"></script>
    <script>
        async function fetchServices() {
            try {
                const response = await fetch('/api/services/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ services: window.serviceCache.ALL_SERVICES })
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const services = await response.json();
                displayServices(services);
            } catch (error) {
                console.error('Error fetching services:', error);
                displayError('Error fetching services. Please try again later.');
            }
        }

        fetchServices();

        function displayServices(services) {
            const serviceList = document.getElementById('service-list');
            const errorMessage = document.getElementById('error-message');
            serviceList.innerHTML = '';
            errorMessage.textContent = '';
            if (services.length > 0) {
                services.forEach(service => {
                    // Sanitize service name for use in IDs (remove special characters)
                    const sanitizedName = service.service.replace(/[^a-zA-Z0-9-_]/g, '');

                    const listItem = document.createElement('li');
                    listItem.className = 'service-item';
                    listItem.id = `services-item-${sanitizedName}`;

                    // Create service name heading
                    const serviceName = document.createElement('h3');
                    serviceName.textContent = service.service;
                    listItem.appendChild(serviceName);

                    // Create status badge
                    const statusBadge = document.createElement('span');
                    statusBadge.className = `status ${service.status === 'running' ? 'running' : 'not-running'}`;
                    statusBadge.id = `services-status-${sanitizedName}`;
                    statusBadge.textContent = service.status;
                    listItem.appendChild(statusBadge);

                    // Create action buttons container
                    const actionButtons = document.createElement('div');
                    actionButtons.className = 'action-buttons';

                    // Create Start/Stop toggle
                    const startStopLabel = document.createElement('div');
                    startStopLabel.className = 'toggle-label';
                    const startStopText = document.createElement('span');
                    startStopText.textContent = 'Start/Stop';
                    startStopLabel.appendChild(startStopText);

                    const startStopSwitch = document.createElement('label');
                    startStopSwitch.className = 'switch';
                    const startStopInput = document.createElement('input');
                    startStopInput.type = 'checkbox';
                    startStopInput.id = `services-toggle-startstop-${sanitizedName}`;
                    startStopInput.checked = service.status === 'running';
                    startStopInput.addEventListener('change', function() {
                        updateService(service.service, this.checked ? 'start' : 'stop');
                    });
                    const startStopSlider = document.createElement('span');
                    startStopSlider.className = 'slider';
                    startStopSwitch.appendChild(startStopInput);
                    startStopSwitch.appendChild(startStopSlider);
                    startStopLabel.appendChild(startStopSwitch);
                    actionButtons.appendChild(startStopLabel);

                    // Create Enable/Disable toggle
                    const enableDisableLabel = document.createElement('div');
                    enableDisableLabel.className = 'toggle-label';
                    const enableDisableText = document.createElement('span');
                    enableDisableText.textContent = 'Enable/Disable';
                    enableDisableLabel.appendChild(enableDisableText);

                    const enableDisableSwitch = document.createElement('label');
                    enableDisableSwitch.className = 'switch';
                    const enableDisableInput = document.createElement('input');
                    enableDisableInput.type = 'checkbox';
                    enableDisableInput.id = `services-toggle-enable-${sanitizedName}`;
                    enableDisableInput.checked = service.enabled === 'enabled';
                    enableDisableInput.addEventListener('change', function() {
                        updateService(service.service, this.checked ? 'enable' : 'disable');
                    });
                    const enableDisableSlider = document.createElement('span');
                    enableDisableSlider.className = 'slider';
                    enableDisableSwitch.appendChild(enableDisableInput);
                    enableDisableSwitch.appendChild(enableDisableSlider);
                    enableDisableLabel.appendChild(enableDisableSwitch);
                    actionButtons.appendChild(enableDisableLabel);

                    listItem.appendChild(actionButtons);

                    // Create enabled status text
                    const enabledStatus = document.createElement('span');
                    enabledStatus.className = `enabled-status ${service.enabled === 'enabled' ? 'enabled' : 'disabled'}`;
                    enabledStatus.id = `services-enabled-${sanitizedName}`;
                    enabledStatus.textContent = service.enabled;
                    listItem.appendChild(enabledStatus);

                    serviceList.appendChild(listItem);
                });
            } else {
                errorMessage.textContent = 'No matching services found.';
            }
        }

        function displayError(message) {
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = message;
        }

        async function updateService(serviceName, action) {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.style.display = 'block';

            try {
                const response = await fetch('/api/services/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        service: serviceName,
                        action: action
                    })
                });

                loadingOverlay.style.display = 'none';

                if (response.ok) {
                    // Invalidate cache so other pages see the change
                    if (window.serviceCache && window.serviceCache.clearCache) {
                        window.serviceCache.clearCache();
                    }
                    await fetchServices();
                } else {
                    alert('Error updating service.');
                }
            } catch (error) {
                loadingOverlay.style.display = 'none';
                console.error('Error updating service:', error);
                alert('Error updating service. Please try again later.');
            }
        }
        window.addEventListener('load', fetchServices);

        window.addEventListener('DOMContentLoaded', () => {
            initNavbar('Services');
            // Initialize neural mesh background (dark mode only)
            NeuralMesh.init();
        });

    </script>
</body>

</html>
