<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Au-Zone LiDAR</title>
    <link href="./css/styles.css" rel="stylesheet">
    <link href="./css/full.css" rel="stylesheet" type="text/css" />
    <script src="./js/tailwind.js"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/neuralMesh.js"></script>
    <script src="./js/serviceCache.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/status.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #lidar-viewport {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #lidar-viewport canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #lidar-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #color-mode {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--color-border);
            background-color: var(--color-bg-surface);
            color: var(--color-text-primary);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 2px 4px var(--color-shadow);
        }

        #color-mode:focus {
            outline: 2px solid var(--brand-gold);
            outline-offset: 2px;
        }

        #cluster-filters {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--color-border);
            background-color: var(--color-bg-surface);
            color: var(--color-text-primary);
            font-size: 13px;
            box-shadow: 0 2px 4px var(--color-shadow);
        }

        #cluster-filters label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        #cluster-filters input[type="checkbox"] {
            accent-color: var(--brand-gold);
        }

        #fusion-warning {
            display: none;
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 8px 16px;
            border-radius: 6px;
            background-color: var(--color-status-warning);
            color: #1a1625;
            font-size: 13px;
            font-weight: 500;
        }

        #lidar-unavailable {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #lidar-unavailable span {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--color-text-muted);
        }
    </style>
</head>

<body>
    <script>
        window.addEventListener('load', () => {
            initNavbar('LiDAR');
            NeuralMesh.init();
        });
    </script>
    <main id="container" class="bg-neural">
        <div id="lidar-viewport" data-testid="lidar-viewport">
            <div id="lidar-controls" data-testid="lidar-controls">
                <select id="color-mode" data-testid="lidar-color-mode">
                    <option value="fixed">Fixed</option>
                    <option value="distance" selected>Distance</option>
                </select>
                <div id="cluster-filters" data-testid="lidar-cluster-filters">
                    <label><input type="checkbox" id="show-noise" checked> Noise</label>
                    <label><input type="checkbox" id="show-ground" checked> Ground</label>
                </div>
            </div>
            <div id="fusion-warning" data-testid="lidar-fusion-warning">Fusion data unavailable — showing distance colours</div>
            <div id="lidar-unavailable" data-testid="lidar-unavailable"><span>LiDAR Unavailable</span></div>
        </div>
    </main>
    <script type="module" src="./js/lidar.js"></script>
</body>

</html>
