<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualization Selector</title>
    <link href="./css/styles.css" rel="stylesheet">
    <link href="./css/full.css" rel="stylesheet" type="text/css" />

    <script src="./js/tailwind.js"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/neuralMesh.js"></script>
    <script src="./js/serviceCache.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/status.js"></script>
    <style>
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .content {
            position: relative;
            z-index: 2;
            background: var(--color-card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 30px var(--color-shadow);
            padding: 40px;
            text-align: center;
            max-width: 800px;
            width: 100%;
            max-height: 100%;
            overflow: auto;
        }

        h1 {
            margin-bottom: 40px;
            font-size: 36px;
            color: var(--color-text-primary);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            flex: 0 1 calc(33.333% - 20px);
            min-width: 200px;
            max-width: 250px;
            background: var(--color-card-bg);
            border: 1px solid var(--color-card-border);
            border-radius: 15px;
            box-shadow: 0 4px 8px var(--color-shadow);
            padding: 20px;
            transition: all 0.15s ease;
            cursor: pointer;
            text-decoration: none;
            color: var(--color-text-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px var(--color-shadow-hover);
            border: 1px solid var(--color-border-hover);
        }

        .card h2 {
            font-size: 24px;
            margin: 0;
            color: var(--color-card-title);
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        .card p {
            font-size: 16px;
            margin: 10px 0 0;
            color: var(--color-light-gray-text);
        }

        .navbar-end .btn-circle svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .navbar-end .btn-circle:hover svg {
            color: #e2e8f0;
        }

        .navbar-end .menu {
            display: flex;
            align-items: center;
        }

        .navbar-end .btn-circle {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar-end .btn-circle svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .navbar-end .btn-circle:hover svg {
            color: #e2e8f0;
        }

        .navbar-end .menu {
            display: flex;
            align-items: center;
        }

        .navbar-end .btn-circle.btn-lg {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar-end .btn-circle.btn-lg svg {
            margin-top: 15px;
            width: 25px;
            height: 25px;
            color: white;
        }

        .navbar-end .btn-circle.btn-lg:hover svg {
            color: #e2e8f0;
        }

        #modeIndicator {
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        #serviceStatusTooltip {
            transition: all 0.2s ease;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
                0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        #serviceStatusContent {
            max-height: 400px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--color-scrollbar-thumb) var(--color-scrollbar-track);
        }

        #serviceStatusContent::-webkit-scrollbar {
            width: 6px;
        }

        #serviceStatusContent::-webkit-scrollbar-track {
            background: var(--color-scrollbar-track);
            border-radius: 3px;
        }

        #serviceStatusContent::-webkit-scrollbar-thumb {
            background-color: var(--color-scrollbar-thumb);
            border-radius: 3px;
        }

        .service-status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        #statusContainer:hover #serviceStatusTooltip {
            display: block;
        }

        #modeIndicator button {
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        #modeIndicator:hover button {
            opacity: 1;
        }

        #modeIndicator svg {
            stroke: currentColor;
        }

        #serviceDialog {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #serviceDialogContent {
            scrollbar-width: thin;
            scrollbar-color: var(--color-scrollbar-thumb) var(--color-scrollbar-track);
        }

        #serviceDialogContent::-webkit-scrollbar {
            width: 6px;
        }

        #serviceDialogContent::-webkit-scrollbar-track {
            background: var(--color-scrollbar-track);
            border-radius: 3px;
        }

        #serviceDialogContent::-webkit-scrollbar-thumb {
            background-color: var(--color-scrollbar-thumb);
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <main class="bg-neural">
        <div class="content">
            <h1>Select Visualization</h1>
            <br />
            <div id="card-container" class="card-container">
            </div>
            <div id="config-details" style="margin-top: 40px;"></div>
        </div>
    </main>

    <script>
        async function fetchConfigAndUpdateDeviceName() {
            try {
                const response = await fetch('/config/webui/details');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const deviceValue = data.DEVICE;

                populateCardContainer(deviceValue);
            } catch (error) {
                console.warn('Could not load config — using defaults:', error);
                populateCardContainer();
            }
        }

        // Track current device type for service-cache callback re-renders
        let currentDeviceType = null;

        function populateCardContainer(deviceType) {
            currentDeviceType = deviceType || 'generic';
            const cardContainer = document.getElementById('card-container');
            const isRaivin = currentDeviceType.toLowerCase().includes('raivin');

            // Clear existing cards
            cardContainer.replaceChildren();

            // Helper function to create a card element with test ID
            function createCard(href, title, descriptionParts) {
                const card = document.createElement('a');
                card.href = href;
                card.className = 'card';

                // Create sanitized name for ID (lowercase, alphanumeric and hyphens only)
                const cardName = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                card.id = `index-card-${cardName}`;
                card.setAttribute('data-testid', `index-card-${cardName}`);

                const h2 = document.createElement('h2');
                h2.textContent = title;
                card.appendChild(h2);

                const p = document.createElement('p');
                // Build description with line breaks safely
                descriptionParts.forEach((part, index) => {
                    if (index > 0) {
                        p.appendChild(document.createElement('br'));
                    }
                    p.appendChild(document.createTextNode(part));
                });
                card.appendChild(p);

                return card;
            }

            // Check if a service is enabled (configured) via the service cache
            function isServiceEnabled(serviceName) {
                const statuses = window.serviceCache?.serviceStatuses;
                if (!Array.isArray(statuses)) return false;
                const entry = statuses.find(s => s.service === serviceName);
                return entry?.enabled === 'enabled';
            }

            // Top row: sensor views
            cardContainer.appendChild(createCard('/camera', 'Camera', ['Camera View']));
            if (isServiceEnabled('lidarpub')) {
                cardContainer.appendChild(createCard('/lidar', 'LiDAR', ['3D Point Cloud']));
            }
            if (isRaivin) {
                cardContainer.appendChild(createCard('/grid', 'Radar', ['Occupancy Grid', '+', 'Radar Point Cloud']));
            }

            // Bottom row: auxiliary sensors
            cardContainer.appendChild(createCard('/imu', 'IMU', ['IMU Visualization']));
            cardContainer.appendChild(createCard('/gps', 'GPS', ['Explore Location']));
        }

        window.addEventListener('load', async () => {
            // Initialize navbar
            initNavbar('Select Visualization');

            // Initialize neural mesh background (dark mode only)
            NeuralMesh.init();

            // Re-populate cards when service statuses update (e.g. lidarpub enabled)
            window.serviceCache.registerUpdateCallback(() => {
                if (currentDeviceType) {
                    populateCardContainer(currentDeviceType);
                }
            });

            // Fetch config and populate cards
            await fetchConfigAndUpdateDeviceName();
        });
    </script>
</body>

</html>
