name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract the section between this version's header and the next version header
          awk -v ver="$VERSION" '/^## \[/{if($0 ~ "\\[" ver "\\]"){found=1; next} else if(found) exit} found{print}' CHANGELOG.md > release_notes.md
          cat release_notes.md

      - name: Create release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cd src && zip -r "../edgefirst-webui-${VERSION}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: edgefirst-webui-${{ steps.version.outputs.version }}.zip
